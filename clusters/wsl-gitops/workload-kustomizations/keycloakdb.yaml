apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloakdb
  namespace: flux-system
spec:
  interval: 5m0s
  path: "./clusters/wsl-gitops/infrastructure-workloads/keycloakdb"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure-database
      namespace: flux-system
