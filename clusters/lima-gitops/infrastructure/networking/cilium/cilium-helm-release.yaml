apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 10m
  chart:
    spec:
      chart: cilium
      version: '1.19.6'
      sourceRef:
        kind: HelmRepository
        name: cilium
      interval: 10m
  values:
    kubeProxyReplacement: true
    l2announcements:
      enabled: true
    k8sServiceHost: kubernetes.default.svc
    k8sServicePort: 443
